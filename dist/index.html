<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Felix Holm — Portfolio</title>
  <meta property="og:title" content="Felix Holm — Portfolio" />
  <meta property="og:description" content="3D Game Artist, Designer &amp; Creator" />
  <meta property="og:image" content="/Environment_Art_1.png" />
  <!-- CSS design system -->
  <script type="module" crossorigin src="/assets/main-BBm8WTLU.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/main-BvSvYus-.css">
</head>
<body>
  <!-- WebGL canvas -->
  <canvas id="webgl-canvas" aria-hidden="true"></canvas>
  <!-- Invisible scroll driver (500vh) -->
  <div id="scroll-driver" aria-hidden="true"></div>
  <!-- Fixed overlay: all UI panels -->
  <div id="scene-overlay">
    <section id="section-hero"      class="scene-section" aria-label="Introduction"></section>
    <section id="section-nav"       class="scene-section" aria-label="Navigation"></section>
    <section id="section-cinematic" class="scene-section" aria-label="Featured Work">
      <div style="width:100%;max-width:1100px">
        <h2 class="section-heading holo-text">Featured Work</h2>
        <div class="cinematic-grid" id="cinematic-grid"></div>
      </div>
    </section>
    <section id="section-portfolio" class="scene-section" aria-label="Portfolio">
      <div style="width:100%;max-width:1200px">
        <h2 class="section-heading holo-text">Portfolio</h2>
        <div class="portfolio-grid" id="portfolio-grid"></div>
      </div>
    </section>
    <section id="section-archival"  class="scene-section" aria-label="Archival Work">
      <div style="width:100%;max-width:1200px">
        <h2 class="section-heading holo-text--violet">Archival Memory</h2>
        <p class="holo-label" style="margin-bottom:2rem;opacity:.5;">::  ARCHIVED RECORDS — EARLY WORK ::</p>
        <div class="archival-grid" id="archival-grid"></div>
      </div>
    </section>
    <section id="section-contact"   class="scene-section" aria-label="Contact"></section>
  </div>
</body>
</html>
