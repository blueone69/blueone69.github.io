name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy static assets to dist
        run: |
          # Images and videos from repo root
          find . -maxdepth 1 \( -name "*.png" -o -name "*.jpg" -o -name "*.mp4" -o -name "*.gif" -o -name "*.webp" \) -exec cp {} dist/ \;
          # Game room folders
          cp -r "Room 1" "Room 2" "Room 3" dist/
          # Standalone pages and their styles
          cp win.html win.css start.html lovestory.html styleGame.css style.css portfolio.css dist/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
